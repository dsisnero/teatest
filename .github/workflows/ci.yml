name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: format, lint, test, parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (with vendored upstream)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # Pinned to the compiler used to accept the current golden fixtures.
      # Shards still float (see plans/parity.md, dependency policy).
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: 1.22.3

      - name: Install shards
        run: shards install

      - name: Check formatting
        run: make format

      # ameba ships a `targets:` entry rather than `executables:`, so
      # `shards install` does not put it on PATH; build the locked version.
      - name: Build ameba
        run: |
          mkdir -p bin
          crystal build lib/ameba/src/cli.cr -o bin/ameba

      - name: Lint
        run: PATH="$PWD/bin:$PATH" make lint

      - name: Test
        run: make test

      # The parity gate forwards to the installed cross-language-crystal-parity
      # skill, which is not vendored here; fetch it the same way a workstation
      # install does and point PARITY_SKILL_DIR at it. The ledger uses the
      # tree-sitter vocabulary, so the preflight resolves the Chiasmus toolchain
      # (cached across runs).
      # The Chiasmus Linux binary links against the tree-sitter runtime shared
      # object (`libtree-sitter.so.0.26`), which the Ubuntu image does not
      # ship. Build the matching 0.26 release once and cache it.
      - name: Cache tree-sitter runtime
        id: tree-sitter-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/tree-sitter
          key: tree-sitter-0.26.13-${{ runner.os }}

      - name: Build tree-sitter runtime
        if: steps.tree-sitter-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v0.26.13 https://github.com/tree-sitter/tree-sitter.git "${RUNNER_TEMP}/tree-sitter"
          make -C "${RUNNER_TEMP}/tree-sitter" -j"$(nproc)"
          make -C "${RUNNER_TEMP}/tree-sitter" install PREFIX="${HOME}/.local/tree-sitter"

      - name: Expose tree-sitter runtime
        run: echo "LD_LIBRARY_PATH=${HOME}/.local/tree-sitter/lib${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Cache Chiasmus toolchain
        uses: actions/cache@v5
        with:
          path: ~/.cache/chiasmus
          key: chiasmus-${{ runner.os }}-v1

      - name: Parity preflight and inventory
        env:
          PARITY_SKILL_DIR: ${{ runner.temp }}/crystal_forge/skills/cross-language-crystal-parity
        run: |
          git clone --depth 1 https://github.com/dsisnero/crystal_forge.git "${RUNNER_TEMP}/crystal_forge"
          "${PARITY_SKILL_DIR}/scripts/verify_skill_install.sh" . go tree-sitter
          make inventory
